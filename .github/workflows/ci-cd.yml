name: CI/CD
on:
  push:   { branches: ["main","pipeline-upgrade"] }
  pull_request: { branches: ["main"] }

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Ensure lockfile
        run: |
          if [ ! -f app/package-lock.json ]; then
            npm install --package-lock-only --prefix app
          fi
      - name: Install deps
        run: npm ci --prefix app
      - name: Lint
        run: npm run lint --prefix app
      - name: Tests
        run: npm test --prefix app
      - name: Docker build (sanity)
        run: docker build -t devops-portfolio:ci .

