name: CI/CD

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure lockfile
        run: |
          if [ ! -f app/package-lock.json ]; then
            npm install --package-lock-only --prefix app
          fi

      - name: Install deps
        run: npm ci --no-audit --no-fund --prefix app

      - name: Run lint
        run: npm run lint --prefix app || echo "lint skipped"

      - name: Run tests
        run: npm test --prefix app || echo "tests skipped"

      - name: Docker build sanity
        run: docker build -t devops-portfolio:ci .

