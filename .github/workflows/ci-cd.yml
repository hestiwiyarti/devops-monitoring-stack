name: CI/CD

on:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show workspace (diagnostic)
        run: |
          pwd
          ls -la
          ls -la app || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure lockfile
        run: |
          if [ ! -f app/package-lock.json ]; then
            npm install --package-lock-only --prefix app
          fi

      - name: Install deps
        run: npm ci --no-audit --no-fund --prefix app

      - name: Lint
        run: npm run lint --prefix app

      - name: Tests
        run: npm test --prefix app

