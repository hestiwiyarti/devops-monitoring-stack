name: CI/CD

on:
  push:
    branches: ["main", "pipeline-upgrade"]   # jalan kalau push ke main atau pipeline-upgrade
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Run lint
        run: npm run lint --prefix app

      - name: Run tests
        run: npm test --prefix app

      - name: Build Docker image
        run: docker build -t devops-portfolio:ci .
