global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9194']

rule_files:
  - "alert_rules.yml"
  - "test_alert.yml"
  - "/etc/prometheus/rules_alert.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9091']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['172.18.0.5:9100']

  - job_name: 'nginx'
    static_configs:
      - targets: ['172.18.0.6:9114']

